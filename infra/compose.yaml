services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: supereasyotp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supereasyotp}  # local dev default only; never reuse in production
      POSTGRES_DB: supereasyotp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
